name: Verify research package

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install pinned package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Compile every Python source
        run: python -m compileall -q .

      - name: Verify package outside repository cwd
        run: python -c "import os,tempfile; os.chdir(tempfile.gettempdir()); import fvg_research; print(fvg_research.__file__)"

      - name: Verify child-script startup
        run: |
          python scripts/prepare_active_contract.py --help
          python scripts/run_original.py --help
          python scripts/postprocess_body_bands.py --help

      - name: Run synthetic and dashboard tests
        run: python -m unittest discover -s tests -v

      - name: Enforce reproducibility policy
        run: python scripts/ci_policy_check.py
