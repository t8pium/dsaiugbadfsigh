name: Verify research package

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Compile Python sources
        run: |
          python -m compileall -q dashboard.py bootstrap.py scripts fvg_research src/original tests

      - name: Verify child script can import local package
        run: |
          python scripts/prepare_active_contract.py --help

      - name: Run synthetic FVG tests
        run: |
          python -m unittest discover -s tests -v

      - name: Validate frozen reference metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reference_results/reference_metrics.json")
          data = json.loads(p.read_text())
          assert data["study"]["active_1m_rows"] == 2303483
          assert "matched_attraction" in data["experiments"]
          assert len(data["experiments"]) == 9
          print("Reference manifest OK")
          PY
